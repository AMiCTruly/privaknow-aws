name: Privaknow CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: pip install ruff

      - name: Lint Lambda Backend
        run: ruff check backend/

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Format Check
        run: terraform -chdir=infra fmt -check

  deploy:
    name: Terraform Deploy
    needs: validate-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform -chdir=infra init

      - name: Import Existing Resources
        working-directory: ./infra
        continue-on-error: true
        run: |
          terraform import aws_dynamodb_table.cache_table privaknow-policy-cache || true
          terraform import aws_ssm_parameter.anthropic_api_key /privaknow/anthropic_api_key || true
          terraform import aws_iam_role.lambda_exec privaknow-lambda-exec-role || true
          terraform import aws_lambda_function.privaknow_api privaknow-policy-analyzer || true
          
      - name: Terraform Apply
        run: terraform -chdir=infra apply -auto-approve